connections {
    host-c-to-host-d {
        version = 2

        local_addrs = 10.20.1.10
        remote_addrs = 10.30.1.20

        local {
            auth = psk
            id = host-c
        }

        remote {
            auth = psk
            id = host-d
        }

        children {
            host-c-to-host-d {
                mode = transport
                local_ts = 10.20.1.10/32
                remote_ts = 10.30.1.20/32

                esp_proposals = aes256gcm16-modp2048

                start_action = trap
            }
        }

        proposals = aes256-sha256-modp2048
    }

    # IKE bypass traps.
    #
    # In transport mode the child's traffic selector (10.20.1.10/32 <->
    # 10.30.1.20/32) also covers this host's own IKE traffic, so without a
    # pass trap every IKE packet would try to establish the very CHILD SA that
    # carries it and negotiation deadlocks.
    #
    # The udp/4500 trap is NOT optional on this topology: once strongSwan
    # detects the NAT it moves IKE onto UDP/4500, so the bypass must exempt
    # that port too or the retransmitted negotiation re-enters the child trap.
    host-c-to-host-d-ike-bypass {
        version = 2
        local_addrs = 10.20.1.10
        remote_addrs = 10.30.1.20

        children {
            host-c-to-host-d-ike-bypass {
                mode = pass
                local_ts = dynamic[udp/500]
                remote_ts = dynamic[udp/500]
                start_action = trap
            }
        }
    }

    host-c-to-host-d-ike-bypass-4500 {
        version = 2
        local_addrs = 10.20.1.10
        remote_addrs = 10.30.1.20

        children {
            host-c-to-host-d-ike-bypass-4500 {
                mode = pass
                local_ts = dynamic[udp/4500]
                remote_ts = dynamic[udp/4500]
                start_action = trap
            }
        }
    }
}