connections {
    host-d-to-host-c {
        version = 2

        local_addrs = 10.30.1.20
        # host-d does NOT see host-c's real address: the NAT node MASQUERADEs
        # 10.20.1.0/24 onto its own WAN address, so 10.30.1.1 is literally what
        # arrives from host-c.
        remote_addrs = 10.30.1.1

        local {
            auth = psk
            id = host-d
        }

        remote {
            auth = psk
            id = host-c
        }

        children {
            host-d-to-host-c {
                mode = transport
                local_ts = 10.30.1.20/32
                remote_ts = 10.30.1.1/32

                esp_proposals = aes256gcm16-modp2048

                start_action = trap
            }
        }

        proposals = aes256-sha256-modp2048
    }

    # See host-c's file: the udp/500 AND udp/4500 pass traps are both required
    # for the transport child to coexist with NAT-T IKE negotiation.
    host-d-to-host-c-ike-bypass {
        version = 2
        local_addrs = 10.30.1.20
        remote_addrs = 10.30.1.1

        children {
            host-d-to-host-c-ike-bypass {
                mode = pass
                local_ts = dynamic[udp/500]
                remote_ts = dynamic[udp/500]
                start_action = trap
            }
        }
    }

    host-d-to-host-c-ike-bypass-4500 {
        version = 2
        local_addrs = 10.30.1.20
        remote_addrs = 10.30.1.1

        children {
            host-d-to-host-c-ike-bypass-4500 {
                mode = pass
                local_ts = dynamic[udp/4500]
                remote_ts = dynamic[udp/4500]
                start_action = trap
            }
        }
    }
}