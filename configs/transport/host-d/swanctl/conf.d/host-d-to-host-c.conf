connections {
    host-d-to-host-c {
        version = 2

        local_addrs = 10.20.1.20
        remote_addrs = 10.20.1.10

        local {
            auth = psk
            id = host-d
        }

        remote {
            auth = psk
            id = host-c
        }

        children {
            host-d-to-host-c {
                mode = transport
                local_ts = 10.20.1.20/32
                remote_ts = 10.20.1.10/32

                esp_proposals = aes256gcm16-modp2048

                start_action = trap
            }
        }

        proposals = aes256-sha256-modp2048
    }

    # IKE (UDP 500) must NOT match the transport child's traffic selector
    # (10.20.1.20/32 <-> 10.20.1.10/32).  Without this pass trap the IKE
    # exchange itself hits the transport trap and deadlocks (chicken-and-egg):
    # every IKE packet would try to establish the very CHILD SA that carries
    # it.  This passive trap exempts the negotiation so charon can run.
    host-d-to-host-c-ike-bypass {
        version = 2
        local_addrs = 10.20.1.20
        remote_addrs = 10.20.1.10

        children {
            host-d-to-host-c-ike-bypass {
                mode = pass
                local_ts = dynamic[udp/500]
                remote_ts = dynamic[udp/500]
                start_action = trap
            }
        }
    }
}
