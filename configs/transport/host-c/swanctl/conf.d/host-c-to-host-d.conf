connections {
    host-c-to-host-d {
        version = 2

        local_addrs = 10.20.1.10
        remote_addrs = 10.20.1.20

        local {
            auth = psk
            id = host-c
        }

        remote {
            auth = psk
            id = host-d
        }

        children {
            host-c-to-host-d {
                mode = transport
                local_ts = 10.20.1.10/32
                remote_ts = 10.20.1.20/32

                esp_proposals = aes256gcm16-modp2048

                start_action = trap
            }
        }

        proposals = aes256-sha256-modp2048
    }

    # IPv6 transport connection, mirroring the IPv4 connection over the
    # topology's 2001:db8:20::/64 link subnet.
    host-c-to-host-d-v6 {
        version = 2

        local_addrs = 2001:db8:20::10
        remote_addrs = 2001:db8:20::20

        local {
            auth = psk
            id = host-c
        }

        remote {
            auth = psk
            id = host-d
        }

        children {
            host-c-to-host-d-v6 {
                mode = transport
                local_ts = 2001:db8:20::10/128
                remote_ts = 2001:db8:20::20/128

                esp_proposals = aes256gcm16-modp2048

                start_action = trap
            }
        }

        proposals = aes256-sha256-modp2048
    }

    # IKE (UDP 500) must NOT match the transport child's traffic selector
    # (10.20.1.10/32 <-> 10.20.1.20/32).  Without this pass trap the IKE
    # exchange itself hits the transport trap and deadlocks (chicken-and-egg):
    # every IKE packet would try to establish the very CHILD SA that carries
    # it.  This passive trap exempts the negotiation so charon can run.
    host-c-to-host-d-ike-bypass {
        version = 2
        local_addrs = 10.20.1.10
        remote_addrs = 10.20.1.20

        children {
            host-c-to-host-d-ike-bypass {
                mode = pass
                local_ts = dynamic[udp/500]
                remote_ts = dynamic[udp/500]
                start_action = trap
            }
        }
    }

    # Same IKE-bypass pass trap for the IPv6-family negotiation.
    host-c-to-host-d-ike-bypass-v6 {
        version = 2
        local_addrs = 2001:db8:20::10
        remote_addrs = 2001:db8:20::20

        children {
            host-c-to-host-d-ike-bypass-v6 {
                mode = pass
                local_ts = dynamic[udp/500]
                remote_ts = dynamic[udp/500]
                start_action = trap
            }
        }
    }
}