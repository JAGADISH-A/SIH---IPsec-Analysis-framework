# gw-a is the monitored gateway.  It terminates TWO simultaneous IKEv2 SAs,
# gw-a<->gw-b and gw-a<->gw-c, both force-encapsulated so they share UDP/4500.
secrets {

    ike-gw-b {
        id-1 = gw-a
        id-2 = gw-b
        secret = "test-ipsec-psk-2026"
    }

    ike-gw-c {
        id-1 = gw-a
        id-2 = gw-c
        secret = "test-ipsec-psk-2026"
    }
}
include conf.d/*.conf
