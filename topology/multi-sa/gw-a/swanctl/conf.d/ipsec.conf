connections {

    # --- SA #1: gw-a <-> gw-b -------------------------------------------------
    gw-a-to-gw-b {

        version = 2
        local_addrs = 192.168.100.1
        remote_addrs = 192.168.100.2

        local {
            auth = psk
            id = gw-a
        }

        remote {
            auth = psk
            id = gw-b
        }

        children {

            lan-a-to-lan-b {

                local_ts = 10.10.1.0/24
                remote_ts = 10.10.2.0/24

                esp_proposals = aes256gcm16-modp2048
                # carries two live IPsec SAs on the same UDP/4500 transport.
                start_action = start
                close_action = restart
            }
        }

        # Force UDP encapsulation so EVERY SA on this gateway
        # rides the same UDP/4500 transport.
        encap = yes
        proposals = aes256-sha256-modp2048
        # A distinct IKE_SA_INIT exchange per peer.
        unique = replace
        keyingtries = 3
    }

    # --- SA #2: gw-a <-> gw-c -------------------------------------------------
    gw-a-to-gw-c {

        version = 2
        local_addrs = 192.168.100.1
        remote_addrs = 192.168.100.3

        local {
            auth = psk
            id = gw-a
        }

        remote {
            auth = psk
            id = gw-c
        }

        children {

            lan-a-to-lan-c {

                local_ts = 10.10.1.0/24
                remote_ts = 10.10.3.0/24

                esp_proposals = aes256gcm16-modp2048
                start_action = start
                close_action = restart
            }
        }

        # Force UDP encapsulation so EVERY SA on this gateway
        # rides the same UDP/4500 transport.
        encap = yes
        proposals = aes256-sha256-modp2048
        unique = replace
        keyingtries = 3
    }
}
